name: release

# A pushed v* tag builds the package and publishes it to PyPI through trusted publishing: no token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
      - run: python -m unittest -v
      - run: python -m pip install build==1.2.2.post1 packaging==24.2 pyproject_hooks==1.2.0
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
