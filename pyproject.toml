[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "oddsrelay"
version = "0.1.0"
description = "The OddsRelay Python client: bookmaker and exchange odds for the UK & Ireland as JSON, standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OddsRelay", email = "hello@oddsrelay.io" }]
keywords = ["odds", "odds api", "bookmakers", "betting exchange", "sports data", "api client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://oddsrelay.io"
Documentation = "https://oddsrelay.io/docs"
Source = "https://github.com/oddsrelay/oddsrelay-python"
Changelog = "https://github.com/oddsrelay/oddsrelay-python/blob/main/CHANGELOG.md"

[tool.flit.sdist]
include = ["CHANGELOG.md", "tests/"]
